# The URL the site will be built for
base_url = "https://gross.dev"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "linkita"

# Site-wide feed off; the blog section emits a blog-only feed at /blog/rss.xml.
generate_feeds = false
feed_filenames = ["rss.xml"]

title = "gross.dev"
description = "Nate Gross' website"

[search]
index_format = "elasticlunr_javascript"

[markdown]
github_alerts=true

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
header_menu_name = "main"

invert_page_navigation = true

profile = "grossnate"

# Don't need Mermaid support yet, but I surely will at some point.
mermaid = false

page_info = [{when="date"}, {when="date_updated", prepend="updated (", append=")"}, {when="status"}, {when="word_count"}]

[extra.menus]
main = [
  { name = "Blog", url = "@base/blog/" },
  { name = "Portfolio", url = "@base/portfolio/" }
]

[extra.profiles.grossnate]

name = "Nate Gross"

social = [
  { name = "linkedin", url = "https://linkedin.com/in/nathangross" },
  { name = "github", url = "https://github.com/GrossNate" },
  { name = "bluesky", url = "https://bsky.app/profile/nate.gross.dev" },
]

[extra.footer]
since = 2026

copyright = "&copy;&nbsp;$YEAR Nathan Gross"